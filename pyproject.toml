[project]
name = "linkedin-coffee-pipeline"
version = "0.1.0"
description = "Jobs → companies → people → warm coffee chats. A local LinkedIn networking & job pipeline: deterministic Python core + a Claude Desktop MCP judgment layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "linkedin-coffee-pipeline" }]
keywords = ["linkedin", "jobs", "networking", "mcp", "claude", "scraping"]

# Core deps are light so the package installs fast and tests run without network libs.
# The heavy scrapers (JobSpy, StaffSpy) are imported LAZILY and declared as extras, so
# `pip install .` works everywhere and `pip install '.[all]'` adds the scrapers.
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "keyring>=24.0",          # OS keychain (macOS Keychain) for secrets
    "requests>=2.31",
]

[project.optional-dependencies]
jobs = [
    "python-jobspy>=1.1.80",  # JobSpy — multi-board job scraper (LinkedIn/Indeed/Glassdoor/Google)
    "pandas>=2.1",
    "pyarrow>=15.0",          # parquet
]
people = [
    "staffspy>=0.2.25",       # StaffSpy — company staff scraper (own logged-in IP)
    "pandas>=2.1",
    "pyarrow>=15.0",
]
mcp = [
    "mcp>=1.2.0",             # official Model Context Protocol SDK (bundles FastMCP)
]
all = [
    "linkedin-coffee-pipeline[jobs,people,mcp]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pandas>=2.1",
    "pyarrow>=15.0",
]

[project.scripts]
lcp = "lcp.cli:app"
lcp-mcp = "lcp.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
